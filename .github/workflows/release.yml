# SPDX-License-Identifier: GPL-2.0-only
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Build PIE source package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION is not a stable semantic version: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version." >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build source archive
        run: |
          mkdir -p dist
          ./scripts/package-source.sh "${{ steps.version.outputs.version }}" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php_getbiblesword-${{ steps.version.outputs.version }}-source
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify packaged source through PIE
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
        env:
          fail-fast: true
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake binutils build-essential cmake curl git \
            libbz2-dev libcurl4-openssl-dev libicu-dev liblzma-dev \
            libtool pkg-config zlib1g-dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: php_getbiblesword-${{ needs.source.outputs.version }}-source
          path: dist
      - name: Build with PIE
        run: |
          cd dist
          sha256sum --check --strict "php_getbiblesword-${{ needs.source.outputs.version }}-src.tgz.sha256"
          cd ..
          mkdir -p extracted
          tar \
            --extract \
            --gzip \
            --file "dist/php_getbiblesword-${{ needs.source.outputs.version }}-src.tgz" \
            --directory extracted
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output /tmp/pie.phar \
            https://github.com/php/pie/releases/download/1.4.8/pie.phar
          package_root="$PWD/extracted/php_getbiblesword-${{ needs.source.outputs.version }}"
          php /tmp/pie.phar repository:add path "$package_root"
          php /tmp/pie.phar build 'getbible/sword:*@dev'

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [source, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: php_getbiblesword-${{ needs.source.outputs.version }}-source
          path: dist
      - name: Publish immutable source release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: |
          gh release create \
            "$RELEASE_TAG" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "getbible/sword $RELEASE_VERSION" \
            --generate-notes \
            --verify-tag
