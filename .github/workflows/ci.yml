# SPDX-License-Identifier: GPL-2.0-only
name: CI

on:
  pull_request:
  push:
    branches: [main, 'agent/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck
      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find tests -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          shellcheck scripts/*.sh tests/*.sh
          bash tests/release-versioning.sh
          bash tests/kjv-baseline-verification.sh
          bash tests/kjv-baseline-recovery.sh
          php -l getbiblesword.stub.php
          php -l tests/integration.php
          php -l scripts/create-kjv-revelation-boundary-artifacts.php

          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION is not a stable semantic version: $version" >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings '@version@' \
              config.m4 php_getbiblesword.h; then
            echo 'Unresolved extension version placeholder found.' >&2
            exit 1
          fi

  build:
    name: PHP ${{ matrix.php }} ${{ matrix.thread_safety }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            thread_safety: nts
          - php: '8.3'
            thread_safety: nts
          - php: '8.4'
            thread_safety: nts
          - php: '8.5'
            thread_safety: nts
          - php: '8.4'
            thread_safety: zts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
        env:
          fail-fast: true
          phpts: ${{ matrix.thread_safety }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake binutils build-essential cmake curl git \
            libbz2-dev libcurl4-openssl-dev libicu-dev liblzma-dev \
            libtool pkg-config zlib1g-dev
      - name: Build and test extension
        run: ./scripts/build-extension.sh
      - name: Build KJV Revelation boundary evidence
        if: matrix.php == '8.4' && matrix.thread_safety == 'nts'
        shell: bash
        run: |
          sudo apt-get install --yes jq unzip
          bash scripts/build-kjv-revelation-boundary-evidence.sh \
            release-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && matrix.php == '8.4' && matrix.thread_safety == 'nts' && hashFiles('release-evidence/*') != '' }}
        with:
          name: kjv-revelation-boundaries-${{ github.sha }}
          path: release-evidence/*
          if-no-files-found: error
          retention-days: 90

  pie:
    name: PIE source-package build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
        env:
          fail-fast: true
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake binutils build-essential cmake curl git \
            libbz2-dev libcurl4-openssl-dev libicu-dev liblzma-dev \
            libtool pkg-config zlib1g-dev
      - name: Download PIE 1.4.8
        run: |
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output /tmp/pie.phar \
            https://github.com/php/pie/releases/download/1.4.8/pie.phar
          php /tmp/pie.phar --version
      - name: Create and build PIE source package
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p dist extracted
          ./scripts/package-source.sh "$version" dist
          tar \
            --extract \
            --gzip \
            --file "dist/php_getbiblesword-${version}-src.tgz" \
            --directory extracted
          package_root="$PWD/extracted/php_getbiblesword-${version}"
          php /tmp/pie.phar repository:add path "$package_root"
          php /tmp/pie.phar build 'getbible/sword:*@dev'
