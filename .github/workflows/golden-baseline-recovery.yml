# SPDX-License-Identifier: GPL-2.0-only
name: Golden Baseline Recovery

on:
  workflow_run:
    workflows: [Golden Baseline]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: golden-baseline-recovery-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  recover:
    name: Propose stable baseline update
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch ==
       github.event.repository.default_branch) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_SHA: >-
        ${{ github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
        env:
          fail-fast: true
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake binutils build-essential cmake curl git \
            libbz2-dev libcurl4-openssl-dev libicu-dev liblzma-dev \
            jq libtool pkg-config unzip zlib1g-dev
      - name: Build and test extension
        run: ./scripts/build-extension.sh
      - name: Generate five independent candidates
        shell: bash
        run: |
          set -euo pipefail
          for run_number in 1 2 3 4 5; do
            output_directory="recovery-evidence/run-${run_number}"
            printf '::group::KJV Revelation boundary candidate run %d\n' \
              "$run_number"
            bash scripts/generate-kjv-revelation-boundary-evidence.sh \
              "$output_directory"
            printf '::endgroup::\n'
          done

          bash scripts/verify-kjv-revelation-boundary-reproducibility.sh \
            recovery-evidence/run-1 \
            recovery-evidence/run-2 \
            recovery-evidence/run-3 \
            recovery-evidence/run-4 \
            recovery-evidence/run-5
      - name: Determine whether the baseline changed
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          readonly candidate_directory='recovery-evidence/run-1'
          if bash scripts/verify-kjv-revelation-boundary-baselines.sh \
              "$candidate_directory" >/dev/null 2>&1; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            {
              printf '### Golden baseline recovery\n\n'
              printf '%s\n' \
                'Five independent runs reproduced the approved baseline.'
              printf '%s\n' \
                'No baseline pull request is required.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          candidate_fingerprint="$(
            (
              cd "$candidate_directory"
              sha256sum \
                kjv-revelation-1.entries.ndjson \
                kjv-revelation-1.txt \
                kjv-revelation-1.manifest.json \
                kjv-revelation-22.entries.ndjson \
                kjv-revelation-22.txt \
                kjv-revelation-22.manifest.json
            ) | sha256sum | cut -d' ' -f1
          )"
          source_sha256="$(
            jq --raw-output '.source_sha256' \
              "$candidate_directory/kjv-revelation-1.manifest.json"
          )"
          {
            echo 'changed=true'
            printf 'fingerprint=%s\n' "$candidate_fingerprint"
            printf 'source_sha256=%s\n' "$source_sha256"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && hashFiles('recovery-evidence/**/*') != '' }}
        with:
          name: kjv-revelation-boundaries-five-run-${{ env.SOURCE_SHA }}
          path: recovery-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Create maintainer-review pull request
        if: steps.candidate.outputs.changed == 'true'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FINGERPRINT: ${{ steps.candidate.outputs.fingerprint }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARCHIVE_SHA256: ${{ steps.candidate.outputs.source_sha256 }}
        run: |
          set -euo pipefail
          readonly candidate_directory='recovery-evidence/run-1'
          readonly branch="automation/kjv-golden-${FINGERPRINT:0:16}"

          existing_pr="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$branch" \
              --state all \
              --json number,state,url \
              --jq '.[0] // empty'
          )"
          if [[ -n "$existing_pr" ]]; then
            {
              printf '### Golden baseline recovery\n\n'
              printf 'A pull request already records this exact candidate:\n\n'
              printf '```json\n%s\n```\n' "$existing_pr"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for chapter in 1 22; do
            baseline_directory="tests/baselines/kjv-revelation-${chapter}"
            mkdir -p -- "$baseline_directory"
            cp \
              "$candidate_directory/kjv-revelation-${chapter}.entries.ndjson" \
              "$baseline_directory/"
            cp \
              "$candidate_directory/kjv-revelation-${chapter}.txt" \
              "$baseline_directory/"
            cp \
              "$candidate_directory/kjv-revelation-${chapter}.manifest.json" \
              "$baseline_directory/"
          done

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$branch"
          git add \
            tests/baselines/kjv-revelation-1/ \
            tests/baselines/kjv-revelation-22/
          if git diff --cached --quiet; then
            echo 'The candidate produced no baseline file change.' >&2
            exit 1
          fi
          git commit -m 'Update KJV Revelation boundary baselines'
          git push origin "HEAD:refs/heads/$branch"

          {
            printf '%s\n\n' '## Golden baseline recovery'
            printf '%s\n\n' \
              'The strict Revelation boundary golden build failed on `main`.'
            printf '%s\n' \
              'This candidate was generated five independent times through'
            printf '%s\n\n' \
              '`GetBible\Sword\Engine`; all six files matched byte-for-byte.'
            printf -- '- Source commit: `%s`\n' "$SOURCE_SHA"
            printf -- '- Candidate fingerprint: `%s`\n' "$FINGERPRINT"
            for chapter in 1 22; do
              entries_sha256="$(
                sha256sum \
                  "$candidate_directory/kjv-revelation-${chapter}.entries.ndjson" \
                  | cut -d' ' -f1
              )"
              text_sha256="$(
                sha256sum \
                  "$candidate_directory/kjv-revelation-${chapter}.txt" \
                  | cut -d' ' -f1
              )"
              printf -- '- Revelation %d entries SHA-256: `%s`\n' \
                "$chapter" \
                "$entries_sha256"
              printf -- '- Revelation %d text SHA-256: `%s`\n' \
                "$chapter" \
                "$text_sha256"
            done
            printf -- '- CrossWire archive SHA-256: `%s`\n\n' \
              "$SOURCE_ARCHIVE_SHA256"
            if [[ -n "$FAILED_RUN_ID" ]]; then
              printf -- '- Failed golden run: %s/actions/runs/%s\n' \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                "$FAILED_RUN_ID"
            fi
            printf -- '- Five-run recovery: %s/actions/runs/%s\n\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID"
            printf '%s\n\n' \
              'The generated five-run artifact is attached to the recovery run.'
            printf '%s\n' '### Maintainer review'
            printf '%s\n\n' \
              'Confirm the changed Scripture output is intentional and correct.'
            printf '%s\n' \
              'Merging this PR is the only operation that promotes the candidate'
            printf '%s\n' \
              'to the approved golden baseline. Closing it rejects the candidate.'
          } > "$RUNNER_TEMP/golden-baseline-pr.md"

          pr_url="$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title 'Update KJV Revelation boundary baselines' \
              --body-file "$RUNNER_TEMP/golden-baseline-pr.md"
          )"

          gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$branch"
          gh workflow run codeql.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$branch"

          {
            printf '### Golden baseline recovery\n\n'
            printf 'Opened maintainer-review pull request: %s\n' "$pr_url"
          } >> "$GITHUB_STEP_SUMMARY"
